spring.application.name=ms-gateway

server.port=${PORT:8090}

# hilos virtuales: el gateway pasa casi todo el tiempo esperando respuestas de los otros servicios
spring.threads.virtual.enabled=true

# a donde se reenvia cada ruta
gateway.url.usuarios=${URL_USUARIOS:http://localhost:8081}
gateway.url.libros=${URL_LIBROS:http://localhost:8082}
gateway.url.prestamos=${URL_PRESTAMOS:http://localhost:8083}
gateway.url.reportes=${URL_REPORTES:http://localhost:8084}