spring.application.name=ms-libros
server.port=${PORT:8082}

# ===== Base de datos =====
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:biblioteca_db}
spring.datasource.username=postgres
spring.datasource.password=admin

# pool de conexiones (4 servicios x 20 = 80, Postgres aguanta 100 por defecto)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000

# ===== JPA =====
# las tablas las crea schema.sql, Hibernate no toca el esquema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ===== Scripts schema.sql / data.sql =====
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# ===== Rendimiento =====
# hilos virtuales de Java 21: muchas peticiones al mismo tiempo sin gastar hilos del SO
spring.threads.virtual.enabled=true
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# ===== JWT (la misma clave en los 4 servicios para que el token sirva en todos) =====
jwt.secret=${JWT_SECRET:bktW9PvRqVQKWljnnWTZY4q3Wk0sFKQqMVAGQeo+Zn7bpyWcR8VsGld2pGEx+YJR}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}